<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 324" width="423" height="324" role="img" aria-labelledby="title desc">
  <title id="title">Script Sentinel — public repository</title>
  <desc id="desc">Local-first JavaScript supply-chain defense from MONAR. Inventory, verify, review, approve.</desc>
