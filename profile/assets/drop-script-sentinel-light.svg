  <text x="22" y="39" fill="#55565a" font-family="monospace" font-size="10" letter-spacing="1.4">DROP 02  /  APPLICATION SECURITY</text>
  <rect x="311" y="21" width="90" height="24" fill="#04050a"/>
  <text x="356" y="37" fill="#FFD21A" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing=".6">LIVE</text>
