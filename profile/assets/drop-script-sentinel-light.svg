  <text x="73" y="111" fill="#55565a" font-family="monospace" font-size="9" letter-spacing="1.1">BY MONAR  /  V1</text>
  <text x="22" y="145" fill="#04050a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600">Know what your pages load.</text>
  <text x="22" y="165" fill="#55565a" font-family="Arial,Helvetica,sans-serif" font-size="11">Review third-party JavaScript before it reaches users.</text>
  <g font-family="monospace" font-size="9" text-anchor="middle">
    <rect x="22" y="193" width="80" height="38" fill="#fbfaf7" stroke="#04050a"/>
